<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard"
      ><span class="brand-mark">PTR</span><span>Admin</span></a
    >
    <nav aria-label="Primary navigation">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="'/' + item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === 'dashboard' }"
          >{{ item.label }}</a
        >
      }
    </nav>
    <div class="sidebar-foot">
      <span class="eyebrow">Signed in as</span
      ><strong>{{ auth.currentToken() ? 'Administrator' : '' }}</strong
      ><button class="link-button" (click)="logout()">Log out</button>
    </div>
  </aside>
  <main class="main-content"><router-outlet /></main>
</div>
