name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check Playwright tests
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: Build production application
        run: npm run build

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_IMAGE }}:prod
            ${{ secrets.DOCKERHUB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker

    steps:
      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          response=$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST "$DOKPLOY_WEBHOOK_URL")
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Dokploy webhook failed with HTTP status: $response"
            exit 1
          fi
          echo "Dokploy webhook triggered successfully (HTTP $response)"
